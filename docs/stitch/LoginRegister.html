<body

                                    id="adventurer-email" placeholder="heroe@firststep.game" required="" type="email"
                                    value="heroe@firststep.game">

                        </div>
                        <div class="space-y-1.5">
                            <div class="flex items-center justify-between">
                                <label
                                    class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider"
                                    for="adventurer-password">
                                    Clave de Acceso / Contraseña
                                </label>
                                <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">¿Olvidaste
                                    tu contraseña?</a>

                            <div class="relative">

                                    id="adventurer-password" placeholder="Introduce contraseña" required=""

                                <button aria-label="Mostrar u ocultar contraseña"

                                    id="toggle-pw" type="button">
                                    <span class="material-symbols-outlined text-body-lg" id="pw-icon">visibility</span>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-2 pt-space-xs hidden" id="section-mascot">
                            <div class="flex items-center justify-between">
                                <label
                                    class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                                    Elige Tu Compañero
                                </label>
                                <span
                                    class="font-label-sm text-label-sm text-secondary bg-surface-container-lowest px-2 py-0.5 rounded">CLASE:
                                    EXPLORADOR</span>
                            </div>
                            <div class="grid grid-cols-2 gap-space-sm" id="mascot-selector">

                                    </div>
                                    <div
                                        class="w-full aspect-square rounded-lg bg-surface-container-lowest overflow-hidden mb-2 relative">
                                        <img alt="Gato Pixel Mascota Luna"
                                            class="w-full h-full object-cover transform group-hover:scale-105 transition-transform"
                                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5BVk1N_vq-J9iBAe5lIFH7ZGJ0Uicl44PCHC8bdb9VdrTzLP5_7eb5QeeN7f1J7BqVVo5-z90HVToR6CZ5ZcZ_Ryjw9NLBytnDFK6dnfQC4NeMPpzY4ebOmV4U5DJBWIPa4sXi9x3BVn-NGCGXweA4lD1UM1LdBwpaqcQq8Tpq4KXL3Y4J9h47A4IIj1fkTFDt1EfkNku9TRW9tqPZxKStKX8qN0y2a80lU4jCsuZ1Ku0RfDL7drobQ">
                                        <div
                                            class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 via-transparent to-transparent">
                                        </div>
                                        <span
                                            class="absolute bottom-1 left-1.5 font-label-sm text-label-sm text-secondary">NIVEL
                                            01</span>
                                    </div>
                                    <div class="flex items-baseline justify-between">
                                        <h2 class="font-headline-sm text-headline-sm text-on-background">Luna</h2>

                                    </div>

                                </div>
                                <div class="relative group cursor-pointer bg-surface-container-high rounded-xl p-2.5 transition-all shadow-md"
                                    id="mascot-buster">
                                    <div
                                        class="w-full aspect-square rounded-lg bg-surface-container-high overflow-hidden mb-2 relative flex items-center justify-center">
                                        <img class="w-full h-full object-cover transform group-hover:scale-105 transition-transform opacity-80"
                                            data-alt="Charming retro 16-bit pixel art pet avatar of a loyal guardian dog pup with adventurous floppy ears and red explorer bandana, neon game palette, cute pixel sprite on dark purple backdrop"
                                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYLIT4_IM5uODZHSLdHxTVnIUlUElXbrgil-Mtv9YF0F31i5oBfCjKHnZhu4qjCftCPJzZR6-TSdjQU7YVRaG131EX71mWEBoDlbdx2j9rWd9J7PRI66jW5PdqTh9PQVREWwcc-ElAeIE3Ic3anHnt1ZKAT1Xfj1HJWVo6U65ZzrV-kDobgaSQePxTb7pPcKKOK-eGlNisni_G6Inj0WSSh0M_dzEimloWi66jhNCFxrWNO1CUoJvnjQ">
                                        <div
                                            class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 via-transparent to-transparent">
                                        </div>
                                        <span

                                            01</span>
                                    </div>

                                    <div

                        <button
                            class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-primary-container to-secondary-container text-on-surface font-headline-sm text-headline-sm tracking-wide uppercase shadow-[0_0_24px_rgba(77,142,255,0.45)] hover:shadow-[0_0_32px_rgba(77,142,255,0.6)] active:translate-y-0.5 transition-all flex items-center justify-center gap-2 mt-space-md"
                            id="submit-btn" type="submit">

                            <span class="">CONTINUAR EXPEDICIÓN</span>

                        </button>

                    <div class="flex items-center gap-3 my-space-md">

                        <div class="h-px bg-surface-variant flex-1"></div>
                    </div>
                    <div class="flex flex-col gap-2.5">

                        <div class="text-center pt-1">
                            <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors"
                                href="#" id="toggle-mode-text">¿ya tienes una cuenta? <span
                                    class="font-label-sm text-label-sm text-primary underline hover:text-primary-fixed transition-colors">inisiar
                                    sesion</span></a>
                        </div>
                    </div>
                </div>
                <div
                    class="flex items-center justify-center gap-space-lg text-outline font-label-sm text-label-sm mt-space-md uppercase tracking-wider">
                    <span class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span> ESTADO DEL SERVIDOR EN LÍNEA
                    </span>


                </div>
            </div>
            <script>
                (function () {
                    const tabLogin = document.getElementById('tab-login');
                    const tabRegister = document.getElementById('tab-register');
                    const fieldHeroName = document.getElementById('field-hero-name');
                    const sectionMascot = document.getElementById('section-mascot');
                    const submitBtn = document.getElementById('submit-btn');
                    const toggleModeText = document.getElementById('toggle-mode-text');
                    const togglePw = document.getElementById('toggle-pw');
                    const adventurerPassword = document.getElementById('adventurer-password');
                    const pwIcon = document.getElementById('pw-icon');
                    const soundBtn = document.getElementById('sound-btn');
                    const soundIcon = document.getElementById('sound-icon');
                    const mascotLuna = document.getElementById('mascot-luna');
                    const mascotBuster = document.getElementById('mascot-buster');

                    let isRegister = true;
                    let isMuted = false;

                    function setMode(registerMode) {
                        isRegister = registerMode;
                        if (isRegister) {
                            tabRegister.className = "py-2 rounded-md bg-secondary-container text-on-secondary-container font-label-md text-label-md shadow-sm transition-all flex items-center justify-center gap-1.5";
                            tabRegister.setAttribute('aria-selected', 'true');
                            tabLogin.className = "py-2 rounded-md font-label-md text-label-md text-outline hover:text-on-surface transition-all flex items-center justify-center gap-1.5";
                            tabLogin.setAttribute('aria-selected', 'false');
                            fieldHeroName.classList.remove('hidden');
                            sectionMascot.classList.remove('hidden');
                            submitBtn.querySelector('span:nth-child(2)').textContent = "INICIAR AVENTURA";
                            toggleModeText.innerHTML = '¿Ya tienes una partida guardada? <span class="font-label-sm text-label-sm text-primary underline">Cargar Partida</span>';
                        } else {
                            tabLogin.className = "py-2 rounded-md bg-secondary-container text-on-secondary-container font-label-md text-label-md shadow-sm transition-all flex items-center justify-center gap-1.5";
                            tabLogin.setAttribute('aria-selected', 'true');
                            tabRegister.className = "py-2 rounded-md font-label-md text-label-md text-outline hover:text-on-surface transition-all flex items-center justify-center gap-1.5";
                            tabRegister.setAttribute('aria-selected', 'false');
                            fieldHeroName.classList.add('hidden');
                            sectionMascot.classList.add('hidden');
                            submitBtn.querySelector('span:nth-child(2)').textContent = "CONTINUAR EXPEDICIÓN";
                            toggleModeText.innerHTML = '¿Nuevo en la torre? <span class="font-label-sm text-label-sm text-primary underline">Crear Partida</span>';
                        }
                    }

                    tabLogin.addEventListener('click', () => setMode(false));
                    tabRegister.addEventListener('click', () => setMode(true));
                    toggleModeText.addEventListener('click', (e) => {
                        e.preventDefault();
                        setMode(!isRegister);
                    });

                    togglePw.addEventListener('click', () => {
                        if (adventurerPassword.type === 'password') {
                            adventurerPassword.type = 'text';
                            pwIcon.textContent = 'visibility_off';
                        } else {
                            adventurerPassword.type = 'password';
                            pwIcon.textContent = 'visibility';
                        }
                    });

                    soundBtn.addEventListener('click', () => {
                        isMuted = !isMuted;
                        soundIcon.textContent = isMuted ? 'volume_off' : 'volume_up';
                    });

                    mascotLuna.addEventListener('click', () => {
                        mascotLuna.className = "relative group cursor-pointer bg-surface-container-high rounded-xl p-2.5 transition-all shadow-md";
                        mascotBuster.className = "relative group cursor-pointer bg-surface-container-lowest rounded-xl p-2.5 hover:bg-surface-container-high transition-all";
                        if (!mascotLuna.querySelector('.material-symbols-outlined')) {
                            const badge = document.createElement('div');
                            badge.className = "absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center shadow-md check-badge";
                            badge.innerHTML = '<span class="material-symbols-outlined text-body-sm font-bold">check</span>';
                            mascotLuna.appendChild(badge);
                        }
                        const busterBadge = mascotBuster.querySelector('.check-badge');
                        if (busterBadge) busterBadge.remove();
                    });

                    mascotBuster.addEventListener('click', () => {
                        mascotBuster.className = "relative group cursor-pointer bg-surface-container-high rounded-xl p-2.5 transition-all shadow-md";
                        mascotLuna.className = "relative group cursor-pointer bg-surface-container-lowest rounded-xl p-2.5 hover:bg-surface-container-high transition-all";
                        if (!mascotBuster.querySelector('.check-badge')) {
                            const badge = document.createElement('div');
                            badge.className = "absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center shadow-md check-badge";
                            badge.innerHTML = '<span class="material-symbols-outlined text-body-sm font-bold">check</span>';
                            mascotBuster.appendChild(badge);
                        }
                        const lunaBadge = mascotLuna.querySelector('.check-badge');
                        if (lunaBadge) lunaBadge.remove();
                    });
                })();
            </script>
        </main>
    </div>

</body>
